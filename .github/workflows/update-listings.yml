name: update-listings

# Everything generated from the entry pages is refreshed here:
# - listing pages (research/index.html, learning/index.html, worklog/index.html)
# - homepage "Latest" ticker and expandable section lists (index.html)
# - the "Recently on notes.rr2.dev" block at the end of every entry page
# New research/<slug>/, learning/<slug>/, or worklog/<slug>/ dirs get picked up here.
#
# The bot's own push uses GITHUB_TOKEN, which does not trigger workflows, so
# rewriting entry pages here cannot loop.
on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'learning/**'
      - 'worklog/**'
      - '!research/index.html'
      - '!learning/index.html'
      - '!worklog/index.html'
      - '.github/scripts/update-listings.py'
      - '.github/workflows/update-listings.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Defense-in-depth: `paths:` above already prevents the workflow from
      # starting on unrelated pushes (zero minutes). This guard fails fast
      # inside the job for edge cases (mixed-file pushes where only outside
      # files changed, etc.). Manual runs always go ahead.
      - name: Guard - exit early unless entries or the generator changed
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run."
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- research learning worklog \
            .github/scripts/update-listings.py .github/workflows/update-listings.yml 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes. Skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Relevant changes:"
            echo "$CHANGED"
          fi
      - if: steps.guard.outputs.changed == 'true'
        run: python3 .github/scripts/update-listings.py
      - if: steps.guard.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research learning worklog index.html
          git diff --cached --quiet || git commit -m "chore(listings): regenerate listings, homepage and recent-notes blocks"
          git push
